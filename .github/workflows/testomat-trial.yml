name: Testomat personal trial

on:
  push:
    branches: [codex/testomat-trial-20261021]
    paths:
      - .github/workflows/testomat-trial.yml
      - .github/testomat/**
      - src/core/auth.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testomat-personal-feishu-sync
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [browser-login]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/testomat/login-demo/package-lock.json
      - name: Install browser tests
        working-directory: .github/testomat/login-demo
        run: npm ci
      - name: Install Chromium
        working-directory: .github/testomat/login-demo
        run: npx playwright install --with-deps chromium
      - name: Start real login application and run Chromium tests
        working-directory: .github/testomat/login-demo
        run: npm test
      - name: Collect browser JUnit report
        if: always() && hashFiles('.github/testomat/login-demo/artifacts/login-junit.xml') != ''
        run: cp .github/testomat/login-demo/artifacts/login-junit.xml trial-results.xml
      - name: Upload report to personal Testomat project
        if: always() && hashFiles('trial-results.xml') != ''
        env:
          TESTOMATIO: ${{ secrets.TESTOMATIO_PERSONAL_TRIAL }}
          TESTOMATIO_TITLE: agenticjobs trial - ${{ matrix.scenario }} - ${{ github.run_id }}
          TESTOMATIO_CREATE: '1'
        run: |
          npx --yes @testomatio/reporter@2.20.0 xml trial-results.xml
      - name: Sync failing and recovered test cases to personal Feishu tasks
        if: always() && hashFiles('trial-results.xml') != ''
        env:
          FEISHU_TESTOMAT_APP_ID: ${{ secrets.FEISHU_TESTOMAT_APP_ID }}
          FEISHU_TESTOMAT_APP_SECRET: ${{ secrets.FEISHU_TESTOMAT_APP_SECRET }}
          FEISHU_TESTOMAT_LIST_GUID: 1254b46c-5edb-4dba-b770-ffea8fab33be
          FEISHU_TESTOMAT_USER_OPEN_ID: ou_72ba2d7d186f85e39786aaa95823d5a3
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/testomat/sync_feishu.py trial-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testomat-${{ matrix.scenario }}
          path: |
            trial-results.xml
            feishu-sync-result.json
            .github/testomat/login-demo/artifacts/
